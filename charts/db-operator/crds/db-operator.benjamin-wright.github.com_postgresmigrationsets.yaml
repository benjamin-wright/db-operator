---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: postgresmigrationsets.db-operator.benjamin-wright.github.com
spec:
  group: db-operator.benjamin-wright.github.com
  names:
    categories:
    - games-hub
    kind: PostgresMigrationSet
    listKind: PostgresMigrationSetList
    plural: postgresmigrationsets
    shortNames:
    - pgms
    singular: postgresmigrationset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.databaseRef
      name: Database
      type: string
    - jsonPath: .spec.database
      name: LogicalDB
      type: string
    - jsonPath: .spec.targetRevision
      name: Target
      type: string
    - jsonPath: .status.currentRevision
      name: Current
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PostgresMigrationSet is the Schema for the postgresmigrationsets API.
          It declares a set of SQL migrations distributed as an ORAS artifact and the
          target revision to converge a logical PostgreSQL database to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresMigrationSetSpec defines the desired state of a PostgresMigrationSet.
            properties:
              artifact:
                description: |-
                  Artifact is an OCI registry reference (e.g. registry.example.com/migrations:v3
                  or registry.example.com/migrations@sha256:…) to an ORAS artifact whose
                  single layer is a tar+gzip of the migration SQL files.
                minLength: 1
                type: string
              database:
                description: |-
                  Database is the logical PostgreSQL database name to apply migrations
                  against. The database is created on demand by the operator if it does
                  not already exist.
                minLength: 1
                type: string
              databaseRef:
                description: |-
                  DatabaseRef is the name of the PostgresDatabase resource in the same
                  namespace whose instance hosts the logical database to migrate.
                minLength: 1
                type: string
              jobTTL:
                description: |-
                  JobTTL is how long completed migration Jobs are retained before the
                  operator deletes them. Defaults to 1h when unset.
                type: string
              paused:
                description: |-
                  Paused, when true, prevents the operator from spawning new migration
                  Jobs. In-flight Jobs are not interrupted.
                type: boolean
              targetRevision:
                description: |-
                  TargetRevision is the migration ID to apply or roll back to. Must equal
                  the numeric prefix of one of the SQL files in the artifact, parsed as
                  an integer (so `0001-init-apply.sql` matches targetRevision: 1).
                format: int64
                minimum: 0
                type: integer
            required:
            - artifact
            - database
            - databaseRef
            - targetRevision
            type: object
          status:
            description: PostgresMigrationSetStatus defines the observed state of
              a PostgresMigrationSet.
            properties:
              activeJob:
                description: |-
                  ActiveJob is the name of the Job currently associated with this
                  migration set, if any.
                type: string
              conditions:
                description: Conditions contains detailed status conditions for the
                  PostgresMigrationSet.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentRevision:
                description: CurrentRevision is the migration ID most recently applied
                  successfully.
                format: int64
                type: integer
              observedArtifact:
                description: |-
                  ObservedArtifact is the digest-pinned reference (repository@sha256:…)
                  the operator most recently resolved spec.artifact to.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation observed by the
                  reconciler when it last updated this status.
                format: int64
                type: integer
              phase:
                default: Pending
                description: Phase is the current lifecycle phase of the migration
                  set.
                enum:
                - Pending
                - Running
                - Ready
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
