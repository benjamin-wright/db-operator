image:
  repository: docker.io/benwright/db-operator
  # tag defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

migrationImage:
  repository: docker.io/benwright/db-migrations
  # tag defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

# jobRegistryHost overrides the registry host used in migration Job artifact
# references. Set this when the in-cluster registry address differs from the
# address the operator uses to resolve artifact digests (e.g. k3d local
# registries where the host uses localhost:5001 but pods use
# db-operator-registry.localhost:5000).
jobRegistryHost: ""

serviceAccountName: ""

instanceName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

mcp:
  # Set to true to deploy the MCP server alongside the operator.
  enabled: false

  image:
    repository: docker.io/benwright/db-mcp
    # tag defaults to .Chart.AppVersion when empty
    tag: ""
    pullPolicy: IfNotPresent

  addr: ":8080"

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
